        // ============================================================
        // CREATE ACTIVITY (Teacher)
        // ============================================================
        async function createActivity() {
            const title = document.getElementById('activityTitle').value.trim();
            const course = document.getElementById('activityCourse').value.trim();
            const description = document.getElementById('activityDescription').value.trim();
            const dueDate = document.getElementById('activityDueDate').value;
            const visibility = document.getElementById('activityVisibility').value;
            const files = document.getElementById('activityFiles').files;

            if (!title) {
                showToast('Please enter an activity title.', 'error');
                return;
            }
            if (!course) {
                showToast('Please enter a course/subject.', 'error');
                return;
            }

            try {
                showToast('Creating activity...', 'warning', 2000);

                const projectData = {
                    title: title,
                    course: course,
                    description: description,
                    owner: currentUserUid,
                    teacherId: currentUserUid,
                    visibility: visibility,
                    type: 'activity',
                    dueDate: dueDate || null,
                    files: [],
                    links: [],
                    comments: [],
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                };

                const projectRef = await db.collection('projects').add(projectData);
                const projectId = projectRef.id;

                // Upload files
                let uploadedFiles = [];
                for (const file of files) {
                    const storageRef = storage.ref('activities/' + projectId + '/' + Date.now() + '_' + file.name);
                    await storageRef.put(file);
                    const downloadURL = await storageRef.getDownloadURL();
                    uploadedFiles.push({
                        name: file.name,
                        url: downloadURL,
                        size: file.size,
                        mimeType: file.type
                    });
                }

                if (uploadedFiles.length > 0) {
                    await db.collection('projects').doc(projectId).update({
                        files: firebase.firestore.FieldValue.arrayUnion(...uploadedFiles)
                    });
                }

                showToast(`✅ Activity "${title}" created successfully!`, 'success');
                document.getElementById('activityTitle').value = '';
                document.getElementById('activityCourse').value = '';
                document.getElementById('activityDescription').value = '';
                document.getElementById('activityFiles').value = '';
                await loadAllData();
                if (isTeacher()) renderTeacherActivities();

            } catch (error) {
                console.error('Create activity error:', error);
                showToast('Failed to create activity: ' + error.message, 'error');
            }
        }

        // ============================================================
        // SEARCH (only for users)
        // ============================================================
        function performSearch() {
            if (currentView !== 'users') return;
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
                renderUsers(allUsers);
                return;
            }

            const filtered = allUsers.filter(user => {
                const name = (user.fullName || user.firstName || '').toLowerCase();
                const id = (user.studentId || '').toLowerCase();
                const email = (user.email || '').toLowerCase();
                return name.includes(query) || id.includes(query) || email.includes(query);
            });

            renderUsers(filtered);
            if (filtered.length === 0) {
                contentArea.innerHTML =
                    `<div class="empty-state"><i class="fas fa-search"></i><p>No users match "${escapeHtml(query)}"</p></div>`;
            }
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // ============================================================
        // VIEW FUNCTIONS
        // ============================================================
        window.viewUser = async function(uid) {
            const user = allUsers.find(u => u.uid === uid);
            if (!user) {
                showToast('User not found.', 'error');
                return;
            }

            const userProjects = allProjects.filter(p =>
                p.owner === uid || (p.participants && p.participants.includes(uid))
            );

            const userMessages = allMessages.filter(m => m.senderId === uid);

            let privateMessages = [];
            const chatsSnap = await db.collection('chats')
                .where('participants', 'array-contains', uid)
                .get();
            for (const chatDoc of chatsSnap.docs) {
                const msgsSnap = await chatDoc.ref.collection('messages')
                    .where('senderId', '==', uid)
                    .get();
                msgsSnap.forEach(doc => {
                    privateMessages.push({
                        id: doc.id,
                        chatId: chatDoc.id,
                        ...doc.data()
                    });
                });
            }

            const isDeveloperUser = user.email === DEVELOPER_EMAIL;
            const role = user.role || 'student';

            let projectsHtml = '';
            if (userProjects.length === 0) {
                projectsHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No projects.</p>';
            } else {
                userProjects.forEach(p => {
                    const files = p.files || [];
                    const fileCount = files.length;
                    projectsHtml += `
                        <div class="project-item">
                            <span class="project-title">${escapeHtml(p.title || 'Untitled')} (${fileCount} file${fileCount !== 1 ? 's' : ''})</span>
                            ${canDelete() ? `<div class="project-actions"><button class="btn btn-danger" onclick="confirmDeleteProject('${p.id}')"><i class="fas fa-trash-alt"></i> Delete</button></div>` : ''}
                        </div>
                    `;
                });
            }

            let filesHtml = '';
            if (userProjects.length === 0) {
                filesHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No files uploaded.</p>';
            } else {
                userProjects.forEach(p => {
                    if (p.files && p.files.length > 0) {
                        p.files.forEach(f => {
                            filesHtml += `
                                <div class="file-item">
                                    <span class="file-name"><i class="fas fa-file"></i> ${escapeHtml(f.name)}</span>
                                    <span class="file-size">${formatFileSize(f.size || 0)}</span>
                                </div>
                            `;
                        });
                    }
                });
                if (!filesHtml) {
                    filesHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No files uploaded.</p>';
                }
            }

            const allUserMessages = [...userMessages, ...privateMessages].sort((a, b) =>
                (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)
            );
            let messagesHtml = '';
            if (allUserMessages.length === 0) {
                messagesHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No messages sent.</p>';
            } else {
                allUserMessages.forEach(m => {
                    const time = m.timestamp ? new Date(m.timestamp.seconds * 1000).toLocaleString() : '';
                    const isPrivate = m.chatId ? 'Private' : 'General';
                    messagesHtml += `
                        <div class="msg-item">
                            <span class="msg-text">${escapeHtml(m.text || '')}</span>
                            <span class="msg-meta">${isPrivate} • ${time}</span>
                        </div>
                    `;
                });
            }

            modalBody.innerHTML = `
                <div class="modal-title">
                    <i class="fas fa-user-circle"></i> ${escapeHtml(user.fullName || user.firstName + ' ' + user.lastName || 'Unknown')}
                    <span class="role-badge ${role}">${role.toUpperCase()}</span>
                    ${isDeveloperUser ? ' <span style="font-size:0.7rem;color:#fbbf24;">(Developer)</span>' : ''}
                </div>

                <div class="detail-section">
                    <h3><i class="fas fa-id-card"></i> Profile</h3>
                    <div class="detail-row"><span class="label">Student ID</span><span class="value">${escapeHtml(user.studentId || 'N/A')}</span></div>
                    <div class="detail-row"><span class="label">Email</span><span class="value">${escapeHtml(user.email || 'N/A')}</span></div>
                    <div class="detail-row"><span class="label">Full Name</span><span class="value">${escapeHtml(user.fullName || user.firstName + ' ' + user.lastName || 'N/A')}</span></div>
                    <div class="detail-row"><span class="label">Bio</span><span class="value">${escapeHtml(user.bio || 'No bio set.')}</span></div>
                    <div class="detail-row"><span class="label">Member Since</span><span class="value">${user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleDateString() : 'N/A'}</span></div>
                </div>

                <div class="detail-section">
                    <h3><i class="fas fa-folder-open"></i> Projects (${userProjects.length})</h3>
                    ${projectsHtml}
                </div>

                <div class="detail-section">
                    <h3><i class="fas fa-file"></i> Files</h3>
                    ${filesHtml}
                </div>

                <div class="detail-section">
                    <h3><i class="fas fa-comment"></i> Messages (${allUserMessages.length})</h3>
                    ${messagesHtml}
                </div>

                <div class="detail-actions">
                    ${!isDeveloperUser && canDelete() ? `
                        <button class="btn btn-danger-delete" onclick="confirmDeleteUser('${user.uid}')">
                            <i class="fas fa-skull-crossbones"></i> DELETE USER PERMANENTLY
                        </button>
                        <span style="font-size:0.6rem;color:#ff6b6b;width:100%;text-align:center;">
                            Deletes: profile, picture, projects, files, messages & chats.
                        </span>
                        <span style="font-size:0.55rem;color:#4a6a5a;width:100%;text-align:center;">
                            Auth account remains.
                        </span>
                    ` : isDeveloperUser ? `
                        <span style="color:#fbbf24;font-size:0.8rem;width:100%;text-align:center;">
                            <i class="fas fa-info-circle"></i> Developer account cannot be deleted.
                        </span>
                    ` : `
                        <span style="color:#4a6a5a;font-size:0.8rem;width:100%;text-align:center;">
                            <i class="fas fa-info-circle"></i> You do not have permission to delete users.
                        </span>
                    `}
                    <button class="btn btn-outline" onclick="closeModal()" style="width:100%;">Close</button>
                </div>
            `;

            modalOverlay.classList.add('active');
        };

        window.viewProject = async function(projectId) {
            const project = allProjects.find(p => p.id === projectId);
            if (!project) {
                showToast('Project not found.', 'error');
                return;
            }

            const owner = allUsers.find(u => u.uid === project.owner);
            const ownerName = owner ? (owner.fullName || owner.firstName) : 'Unknown';
            const files = project.files || [];
            const comments = project.comments || [];

            let filesHtml = '';
            if (files.length === 0) {
                filesHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No files.</p>';
            } else {
                files.forEach(f => {
                    filesHtml += `
                        <div class="file-item">
                            <span class="file-name"><i class="fas fa-file"></i> ${escapeHtml(f.name)}</span>
                            <span class="file-size">${formatFileSize(f.size || 0)}</span>
                        </div>
                    `;
                });
            }

            let commentsHtml = '';
            if (comments.length === 0) {
                commentsHtml = '<p style="color:#4a6a5a;font-size:0.8rem;">No comments.</p>';
            } else {
                comments.forEach(c => {
                    const time = c.timestamp ? new Date(c.timestamp.seconds * 1000).toLocaleString() : '';
                    commentsHtml += `
                        <div class="msg-item">
                            <span class="msg-text">${escapeHtml(c.text || '')}</span>
                            <span class="msg-meta">${escapeHtml(c.commenterName || 'Unknown')} • ${time}</span>
                        </div>
                    `;
                });
            }

            modalBody.innerHTML = `
                <div class="modal-title"><i class="fas fa-folder-open"></i> ${escapeHtml(project.title || 'Untitled')}</div>
                <div class="detail-section">
                    <h3><i class="fas fa-info-circle"></i> Details</h3>
                    <div class="detail-row"><span class="label">Owner</span><span class="value">${escapeHtml(ownerName)}</span></div>
                    <div class="detail-row"><span class="label">Visibility</span><span class="value">${project.visibility || 'Personal'}</span></div>
                    <div class="detail-row"><span class="label">Type</span><span class="value">${project.type || 'Individual'}</span></div>
                    <div class="detail-row"><span class="label">Course</span><span class="value">${escapeHtml(project.course || 'N/A')}</span></div>
                    ${project.dueDate ? `<div class="detail-row"><span class="label">Due Date</span><span class="value">${new Date(project.dueDate).toLocaleString()}</span></div>` : ''}
                </div>
                <div class="detail-section">
                    <h3><i class="fas fa-file"></i> Files (${files.length})</h3>
                    ${filesHtml}
                </div>
                <div class="detail-section">
                    <h3><i class="fas fa-comment"></i> Comments (${comments.length})</h3>
                    ${commentsHtml}
                </div>
                <div class="detail-actions">
                    ${canDelete() ? `<button class="btn btn-danger" onclick="confirmDeleteProject('${projectId}')"><i class="fas fa-trash-alt"></i> Delete Project</button>` : ''}
                    <button class="btn btn-outline" onclick="closeModal()">Close</button>
                </div>
            `;

            modalOverlay.classList.add('active');
        };

        window.viewMessage = async function(messageId, chatId) {
            let message;
            let type;

            if (chatId === 'general') {
                message = allMessages.find(m => m.id === messageId);
                type = 'General';
            } else {
                message = allPrivateMessages.find(m => m.id === messageId);
                type = 'Private';
            }

            if (!message) {
                showToast('Message not found.', 'error');
                return;
            }

            const sender = allUsers.find(u => u.uid === message.senderId);
            const senderName = sender ? (sender.fullName || sender.firstName) : (message.senderName || 'Unknown');
            const time = message.timestamp ? new Date(message.timestamp.seconds * 1000).toLocaleString() : '';

            modalBody.innerHTML = `
                <div class="modal-title"><i class="fas fa-comment"></i> Message</div>
                <div class="detail-section">
                    <h3><i class="fas fa-info-circle"></i> Details</h3>
                    <div class="detail-row"><span class="label">Type</span><span class="value">${type}</span></div>
                    <div class="detail-row"><span class="label">From</span><span class="value">${escapeHtml(senderName)}</span></div>
                    <div class="detail-row"><span class="label">Time</span><span class="value">${time}</span></div>
                    ${message.chatId ? `<div class="detail-row"><span class="label">Chat ID</span><span class="value">${escapeHtml(message.chatId)}</span></div>` : ''}
                </div>
                <div class="detail-section">
                    <h3><i class="fas fa-comment-dots"></i> Content</h3>
                    <div style="padding:0.5rem;background:#0f172a;border-radius:6px;border:1px solid #1a3a20;color:#c8d6e5;word-wrap:break-word;white-space:pre-wrap;">${escapeHtml(message.text || '')}</div>
                </div>
                <div class="detail-actions">
                    ${canDelete() ? `<button class="btn btn-danger" onclick="confirmDeleteMessage('${messageId}', '${chatId}')"><i class="fas fa-trash-alt"></i> Delete Message</button>` : ''}
                    <button class="btn btn-outline" onclick="closeModal()">Close</button>
                </div>
            `;

            modalOverlay.classList.add('active');
        };

        // ============================================================
        // CONFIRMATION WRAPPERS
        // ============================================================
        window.confirmDeleteProject = function(projectId) {
            if (!canDelete()) {
                showToast('You do not have permission to delete projects.', 'error');
                return;
            }
            const project = allProjects.find(p => p.id === projectId);
            if (!project) {
                showToast('Project not found.', 'error');
                return;
            }
            const name = project.title || 'Untitled';
            showConfirm(
                'DELETE PROJECT',
                'This will permanently delete this project and all its files.',
                `<span class="highlight">"${escapeHtml(name)}"</span><br>This action cannot be undone.`,
                'Delete Project',
                async function() { await deleteProjectAction(projectId); }
            );
        };

        window.confirmDeleteMessage = function(messageId, chatId) {
            if (!canDelete()) {
                showToast('You do not have permission to delete messages.', 'error');
                return;
            }
            showConfirm(
                'DELETE MESSAGE',
                'This will permanently delete this message.',
                'This message will be removed from the database.<br>This action cannot be undone.',
                'Delete Message',
                async function() { await deleteMessageAction(messageId, chatId); }
            );
        };

        window.confirmDeleteUser = function(uid) {
            if (!canDelete()) {
                showToast('You do not have permission to delete users.', 'error');
                return;
            }
            const user = allUsers.find(u => u.uid === uid);
            if (!user) {
                showToast('User not found.', 'error');
                return;
            }
            if (user.email === DEVELOPER_EMAIL) {
                showToast('Cannot delete the developer.', 'error');
                return;
            }
            const name = user.fullName || user.firstName || 'Unknown';
            showConfirm(
                'DELETE USER PERMANENTLY',
                'All user data will be permanently removed.',
                `<span class="highlight">${escapeHtml(name)}</span><br>ID: ${escapeHtml(user.studentId || 'N/A')}<br><br>Deletes: profile, picture, projects, files, messages & chats.<br>⚠️ Auth account remains.`,
                'Delete User',
                async function() { await deleteUserAction(uid); }
            );
        };

        // ============================================================
        // DELETE ACTIONS
        // ============================================================
        async function deleteProjectAction(projectId) {
            const project = allProjects.find(p => p.id === projectId);
            if (!project) return;

            try {
                showToast('Deleting project...', 'warning', 3000);
                const files = project.files || [];
                for (const f of files) {
                    try { const ref = storage.refFromURL(f.url);
                        await ref.delete(); } catch (e) {}
                }
                await db.collection('projects').doc(projectId).delete();
                showToast(`Project "${project.title || 'Untitled'}" deleted.`, 'success');
                closeModal();
                await loadAllData();
            } catch (error) {
                console.error('Delete project error:', error);
                showToast('Failed to delete project: ' + error.message, 'error');
            }
        }

        async function deleteMessageAction(messageId, chatId) {
            try {
                if (chatId === 'general') {
                    await db.collection('generalMessages').doc(messageId).delete();
                } else {
                    await db.collection('chats').doc(chatId).collection('messages').doc(messageId).delete();
                }
                showToast('Message deleted.', 'success');
                closeModal();
                await loadAllData();
            } catch (error) {
                console.error('Delete message error:', error);
                showToast('Failed to delete message: ' + error.message, 'error');
            }
        }

        async function deleteUserAction(uid) {
            const user = allUsers.find(u => u.uid === uid);
            if (!user || user.email === DEVELOPER_EMAIL) return;

            try {
                showToast('Deleting user...', 'warning', 5000);

                if (user.profilePicture) {
                    try { const ref = storage.refFromURL(user.profilePicture);
                        await ref.delete(); } catch (e) {}
                }

                const userProjects = allProjects.filter(p =>
                    p.owner === uid || (p.participants && p.participants.includes(uid))
                );

                for (const p of userProjects) {
                    if (p.files) {
                        for (const f of p.files) {
                            try { const ref = storage.refFromURL(f.url);
                                await ref.delete(); } catch (e) {}
                        }
                    }
                    await db.collection('projects').doc(p.id).delete();
                }

                const userMessages = allMessages.filter(m => m.senderId === uid);
                for (const m of userMessages) {
                    await db.collection('generalMessages').doc(m.id).delete();
                }

                const chatsSnap = await db.collection('chats')
                    .where('participants', 'array-contains', uid)
                    .get();
                for (const chatDoc of chatsSnap.docs) {
                    const msgsSnap = await chatDoc.ref.collection('messages').get();
                    for (const msgDoc of msgsSnap.docs) {
                        await msgDoc.ref.delete();
                    }
                    await chatDoc.ref.delete();
                }

                await db.collection('users').doc(uid).delete();
                showToast(`User "${user.fullName || user.firstName}" deleted.`, 'success');
                closeModal();
                await loadAllData();
            } catch (error) {
                console.error('Delete user error:', error);
                showToast('Deletion failed: ' + error.message, 'error');
            }
        }

        // ============================================================
        // MODAL CONTROLS
        // ============================================================
        function closeModal() { modalOverlay.classList.remove('active'); }
        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ============================================================
        // HELPERS
        // ============================================================
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        console.log('Control Panel ready.');
        console.log('Developer email: ' + DEVELOPER_EMAIL);
        console.log('Login with your Student ID and password.');
    </script>

</body>
</html>
